<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>MyAI — Your workspace</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#0e1727;--panel2:#111e31;--line:#23344d;--text:#eaf2ff;--muted:#91a4bf;--cyan:#62e6f5;--violet:#9a9cff;--good:#62e6b2;--danger:#ff8295}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 65% -20%,#1a3655 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
#loginView{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:#0e1727ed;box-shadow:0 28px 90px #0007}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.13em}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07111c;font-size:21px}.muted{color:var(--muted)}.login-card h1{font-size:28px;margin:25px 0 4px}.field{width:100%;padding:13px 14px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#080f1c;color:var(--text);outline:none}.field:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #62e6f51c}.primary{border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(120deg,var(--cyan),#a4a7ff);color:#07111c;font-weight:800}.login-card .primary{width:100%;margin-top:16px}#loginError{color:var(--danger);min-height:22px;font-size:13px}
#app{display:none;min-height:100vh}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;background:#0b1321d9;border-right:1px solid #ffffff12;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(18px)}.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}.side-head .brand{font-size:13px}.new-chat{width:100%;text-align:left;padding:13px 14px;border:1px solid #3a6278;border-radius:13px;color:#eaffff;background:linear-gradient(120deg,#123447,#202747);font-weight:700}.new-chat span{color:var(--cyan);font-size:20px;margin-right:9px}.section-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#7187a5;padding:0 8px}.chat-list{overflow:auto;display:flex;flex-direction:column;gap:5px;min-height:50px}.chat-row{display:flex;gap:4px;align-items:center;border:1px solid transparent;border-radius:11px}.chat-row.active{background:#17283d;border-color:#294b66}.chat-title{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:#b8c8de;padding:10px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.chat-row.active .chat-title{color:#f0fbff}.delete{border:0;background:transparent;color:#7286a0;padding:8px 10px;border-radius:8px}.delete:hover{color:var(--danger);background:#ff82951a}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.account{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:10px 3px}.ghost{background:transparent;color:#a9bdd6;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid #ffffff10;background:#080d18a8;backdrop-filter:blur(14px);position:sticky;top:0;z-index:2}.top-title{font-weight:700}.status{font-size:12px;color:var(--good)}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:8px;box-shadow:0 0 12px #62e6b2}.content{width:min(900px,100%);margin:0 auto;padding:0 26px;flex:1;display:flex;flex-direction:column}.welcome{margin:auto auto 20px;text-align:center;max-width:600px;padding:42px 0}.orb{width:64px;height:64px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;font-size:30px;color:#07111c;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 12px 50px #62e6f52b}.welcome h2{font-size:clamp(27px,4vw,40px);letter-spacing:-.04em;margin:0 0 9px}.welcome p{color:var(--muted);margin:0}.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}.suggestions button{border:1px solid var(--line);background:#101b2c;color:#b9cbe2;border-radius:999px;padding:9px 13px;font-size:12px}.messages{padding:28px 0 18px;display:flex;flex-direction:column;gap:17px}.message{max-width:min(85%,760px);padding:14px 17px;border:1px solid var(--line);border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.message.user{align-self:flex-end;background:linear-gradient(135deg,#17394b,#1b2944);border-color:#315c77;border-bottom-right-radius:5px}.message.ai{align-self:flex-start;background:#111c2c;border-bottom-left-radius:5px}.message .who{display:block;color:var(--cyan);font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px}.composer-wrap{position:sticky;bottom:0;padding:18px 0 25px;background:linear-gradient(180deg,transparent,var(--bg) 22%)}.composer{display:flex;align-items:flex-end;gap:10px;padding:9px;border:1px solid #344762;border-radius:18px;background:#101a2a;box-shadow:0 16px 45px #0005}.composer textarea{flex:1;resize:none;max-height:180px;min-height:46px;border:0;outline:0;background:transparent;color:var(--text);padding:11px 10px}.composer textarea::placeholder{color:#7488a5}.send{min-width:48px;height:44px;border-radius:13px}.hint{text-align:center;color:#7185a0;font-size:11px;margin-top:9px}.hidden{display:none!important}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;min-height:0;padding:12px;border-right:0;border-bottom:1px solid #ffffff12;gap:10px}.side-head{padding-bottom:0}.chat-list{flex-direction:row;max-height:45px}.chat-row{flex:0 0 auto;max-width:220px}.chat-title{max-width:175px}.side-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:0;padding-top:8px}.account{max-width:55%;margin:0}.topbar{height:56px}.content{padding:0 14px}.message{max-width:94%}.welcome{padding:28px 0}}
</style>
</head>
<body>
<section id="loginView">
  <div class="login-card">
    <div class="brand"><span class="brand-mark">✦</span><span>MYAI <span class="muted">/ PRIVATE WORKSPACE</span></span></div>
    <h1>Welcome back.</h1><p class="muted">Sign in to open your personal AI workspace.</p>
    <input class="field" id="email" type="email" autocomplete="username" placeholder="Email address">
    <input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button class="primary" id="loginButton">Sign in</button><p id="loginError"></p>
  </div>
</section>
<div id="app">
 <div class="shell">
  <aside class="sidebar">
   <div class="side-head"><div class="brand"><span class="brand-mark">✦</span> MYAI</div><button class="ghost" id="logoutButton">Log out</button></div>
   <button class="new-chat" id="newChat"><span>＋</span>New conversation</button>
   <div class="section-label">Your conversations</div>
   <div class="chat-list" id="chatList"></div>
   <div class="side-bottom"><div class="section-label">Signed in</div><div class="account" id="accountName"></div><button class="ghost" id="memoryButton">Edit memory</button></div>
  </aside>
  <main class="main">
   <header class="topbar"><div class="top-title" id="chatHeading">New conversation</div><div class="status" id="connectionStatus">Ready</div></header>
   <div class="content">
    <div class="welcome" id="welcome">
     <div class="orb">✦</div><h2>What can I help you with?</h2><p>Think, create, learn, plan, and explore — all in one place.</p>
     <div class="suggestions"><button data-prompt="Help me understand a difficult topic.">Explain something</button><button data-prompt="Help me brainstorm a project idea.">Brainstorm ideas</button><button data-prompt="Help me write or improve something.">Write with me</button></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Message MyAI…"></textarea><button class="primary send" id="sendButton" aria-label="Send message">↑</button></div><div class="hint">MyAI can make mistakes. Check important information.</div></div>
   </div>
  </main>
 </div>
</div>
<script>
const firebaseConfig = {
 apiKey:"AIzaSyApBrPRZk7e7M6uOU3-eNcX7nmH_sXkjKI",
 authDomain:"ink-and-moon.firebaseapp.com",
 projectId:"ink-and-moon",
 storageBucket:"ink-and-moon.firebasestorage.app",
 messagingSenderId:"943504163747",
 appId:"1:943504163747:web:8eb03578746b4737d01016"
};
const WORKER_URL="https://myai-backend.ilevesque.workers.dev";
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let me=null, activeChatId=null, chatGroups={}, memory={about:"",likes:""};
const $=id=>document.getElementById(id);
function makeId(){return "chat_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function titleFor(items){const m=items.find(x=>x.from==="user");return m?(m.text||"New conversation").replace(/\s+/g," ").slice(0, thirtyFour):"New conversation"}
const thirtyFour=34;
function showLogin(error=""){$("loginView").style.display="grid";$("app").style.display="none";$("loginError").textContent=error}
function showApp(){$("loginView").style.display="none";$("app").style.display="block"}
async function login(){try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){showLogin(e.message)}}
$("loginButton").addEventListener("click",login);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("logoutButton").addEventListener("click",()=>auth.signOut());
auth.onAuthStateChanged(async user=>{
 me=user;
 if(!user){showLogin();return}
 showApp();$("accountName").textContent=user.displayName||user.email||"Signed in";
 await loadMemory();await loadChats();
 if(!activeChatId) newChat(false);
});
async function loadMemory(){try{const d=await db.collection("myai_memory").doc(me.uid).get();if(d.exists)memory=d.data();}catch(e){console.warn("Memory unavailable",e)}}
async function loadChats(){
 try{
  const snap=await db.collection("myai_chats").where("uid","==",me.uid).limit(200).get();
  chatGroups={};
  snap.docs.forEach(doc=>{const x={id:doc.id,...doc.data()};const id=x.chatId||"legacy";(chatGroups[id]??=[]).push(x)});
  Object.values(chatGroups).forEach(a=>a.sort((x,y)=>(x.at?.seconds||0)-(y.at?.seconds||0)));
  renderChatList();
  const ids=sortedIds();if(ids.length)await openChat(ids[0]);
 }catch(e){console.warn("Chat history unavailable",e)}
}
function sortedIds(){return Object.keys(chatGroups).sort((a,b)=>(chatGroups[b].at(-1)?.at?.seconds||0)-(chatGroups[a].at(-1)?.at?.seconds||0))}
function renderChatList(){
 const list=$("chatList");list.replaceChildren();
 sortedIds().forEach(id=>{
  const row=document.createElement("div");row.className="chat-row"+(id===activeChatId?" active":"");
  const b=document.createElement("button");b.className="chat-title";b.textContent=titleFor(chatGroups[id]);b.onclick=()=>openChat(id);
  const d=document.createElement("button");d.className="delete";d.textContent="×";d.title="Delete conversation";d.onclick=()=>deleteChat(id);
  row.append(b,d);list.append(row);
 });
}
function newChat(greet=true){activeChatId=makeId();$("messages").replaceChildren();$("welcome").classList.remove("hidden");$("chatHeading").textContent="New conversation";renderChatList();if(greet)addMessage("assistant","New conversation ready. What would you like to work on?")}
async function openChat(id){activeChatId=id;$("messages").replaceChildren();$("welcome").classList.add("hidden");(chatGroups[id]||[]).forEach(x=>addMessage(x.from,x.text));$("chatHeading").textContent=titleFor(chatGroups[id]||[]);renderChatList()}
function addMessage(role,text){$("welcome").classList.add("hidden");const el=document.createElement("div");el.className="message "+(role==="user"?"user":"ai");const who=document.createElement("span");who.className="who";who.textContent=role==="user"?"You":"MyAI";const body=document.createElement("div");body.textContent=text;el.append(who,body);$("messages").append(el);el.scrollIntoView({block:"nearest"})}
async function saveMessage(from,text){
 const record={uid:me.uid,chatId:activeChatId,from,text,at:new Date()};
 try{const ref=await db.collection("myai_chats").add(record);(chatGroups[activeChatId]??=[]).push({...record,id:ref.id,at:{seconds:Math.floor(Date.now()/1000)}});renderChatList();$("chatHeading").textContent=titleFor(chatGroups[activeChatId]);}catch(e){console.warn("Could not save message",e)}
}
async function deleteChat(id){
 if(!confirm("Delete this conversation and its messages?"))return;
 try{const snap=await db.collection("myai_chats").where("uid","==",me.uid).where("chatId","==",id).get();const batch=db.batch();snap.docs.forEach(d=>batch.delete(d.ref));await batch.commit();delete chatGroups[id];if(activeChatId===id)newChat(false);renderChatList()}catch(e){alert("Could not delete this conversation: "+e.message)}
}
$("newChat").addEventListener("click",()=>newChat());
$("memoryButton").addEventListener("click",async()=>{
 const about=prompt("What should MyAI remember about you?",memory.about||"");if(about===null)return;
 memory.about=about;try{await db.collection("myai_memory").doc(me.uid).set({...memory,updated:new Date()});alert("Memory saved.")}catch(e){alert("Could not save memory: "+e.message)}
});
async function send(){
 const input=$("prompt"),text=input.value.trim();if(!text||!me)return;
 input.value="";input.style.height="auto";addMessage("user",text);await saveMessage("user",text);
 const pending=document.createElement("div");pending.className="message ai";pending.textContent="Thinking…";$("messages").append(pending);
 $("connectionStatus").textContent="Working…";
 try{
  const history=(chatGroups[activeChatId]||[]).slice(-14).map(m=>({role:m.from==="user"?"user":"assistant",content:String(m.text||"").slice(0,5000)}));
  const token=await me.getIdToken();
  const response=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({messages:[{role:"system",content:"You are MyAI, a helpful and capable personal AI assistant. Be accurate, clear, thoughtful, and transparent about uncertainty. User context: "+(memory.about||"")+". Preferences: "+(memory.likes||"")},...history]})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"AI service returned HTTP "+response.status);
  if(!data.reply)throw new Error("The AI service returned an empty reply.");
  pending.remove();addMessage("assistant",data.reply);await saveMessage("assistant",data.reply);
  $("connectionStatus").textContent="Response received";
 }catch(e){pending.remove();const msg="I couldn't complete that request: "+e.message;addMessage("assistant",msg);await saveMessage("assistant",msg);$("connectionStatus").textContent="Connection issue";console.error(e)}
}
$("sendButton").addEventListener("click",send);
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("prompt").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,180)+"px"});
document.querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>{$("prompt").value=b.dataset.prompt;$("prompt").focus()}));
</script>
</body>
</html>
